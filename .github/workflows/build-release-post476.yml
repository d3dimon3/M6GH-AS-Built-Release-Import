name: Build Release APKs (Post 476) - D3
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out post-476 Release candidate source
        uses: actions/checkout@v4
        with:
          ref: release-post476
          persist-credentials: false
      - name: Install UI assets
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          rm -rf /tmp/mazda_assets
          unzip -q Mazda6GH_WhiteRed_Complete_UI_Assets.zip -d /tmp/mazda_assets
          find /tmp/mazda_assets/Mazda6GH_WhiteRed_Production_Assets -name '*.png' -exec cp {} app/src/main/res/drawable-nodpi/ \;
          unzip -q -j Mazda6GH_Header_and_Lock_Assets.zip '*.png' -d app/src/main/res/drawable-nodpi/
          echo "Installed $(find app/src/main/res/drawable-nodpi -name '*.png' | wc -l) PNG assets"
      - name: Install Studio splash and icon assets
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/drawable-nodpi
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/Calibre90/Mazda6GH-AsBuilt-Studio-Android/main/assets/splash_studio.png" \
            -o app/src/main/res/drawable-nodpi/splash_studio.png
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/Calibre90/Mazda6GH-AsBuilt-Studio-Android/main/assets/icon_studio.png" \
            -o app/src/main/res/drawable-nodpi/icon_studio.png
          python3 - <<'PY'
          import struct
          from pathlib import Path
          for name in ("splash_studio", "icon_studio"):
              path = Path("app/src/main/res/drawable-nodpi") / (name + ".png")
              with path.open("rb") as f:
                  header = f.read(24)
              if len(header) < 24 or header[:8] != bytes.fromhex("89504e470d0a1a0a") or header[12:16] != b"IHDR":
                  raise SystemExit(f"Invalid PNG: {path}")
              width, height = struct.unpack(">II", header[16:24])
              if width < 512 or height < 512:
                  raise SystemExit(f"Image too small: {path}: {width}x{height}")
              print(f"Validated {path}: {width}x{height}")
          PY
      - name: Install corrected Admin launcher icon
        shell: bash
        run: |
          set -euo pipefail
          # The owner uploads the icon archive to the main branch.
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/Calibre90/as_test_mob/main/M6_GH_Admin_Icon.zip" \
            -o "$RUNNER_TEMP/M6_GH_Admin_Icon.zip"
          python3 - <<'PY'
          import io, zipfile, struct
          from pathlib import Path
          archive = Path(__import__('os').environ['RUNNER_TEMP']) / 'M6_GH_Admin_Icon.zip'
          with zipfile.ZipFile(archive) as z:
              files = [x for x in z.namelist() if x.lower().endswith('.png') and not x.startswith('__MACOSX/')]
              if len(files) != 1:
                  raise SystemExit(f'Expected one PNG in Admin icon archive; found {files}')
              data = z.read(files[0])
          if data[:8] != b'\x89PNG\r\n\x1a\n' or data[12:16] != b'IHDR':
              raise SystemExit('Invalid Admin icon PNG')
          w, h = struct.unpack('>II', data[16:24])
          if min(w,h) < 256:
              raise SystemExit(f'Admin icon too small: {w}x{h}')
          target = Path('app/src/main/res/drawable-nodpi/admin_icon.png')
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_bytes(data)
          print(f'Installed corrected Admin launcher icon: {w}x{h}, {len(data)} bytes')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check admin module inputs
        run: |
          test -f catalog-admin/src/main/java/com/calibre90/catalogadmin/AdminActivity.java
          test -f catalog-admin/src/main/AndroidManifest.xml
      - name: Test RSA catalog signing and tamper rejection
        run: python3 catalog/test_signing.py
      - name: Run ABT and feature engine regression tests
        run: |
          mkdir -p /tmp/abt-test-classes
          javac -d /tmp/abt-test-classes app/src/main/java/com/calibre90/astestmob/AbtCodec.java app/src/main/java/com/calibre90/astestmob/FeatureEngine.java app/src/main/java/com/calibre90/astestmob/AbtSnapshot.java app/src/test/java/com/calibre90/astestmob/CodecSelfTest.java
          java -cp /tmp/abt-test-classes com.calibre90.astestmob.CodecSelfTest
      - name: Prepare stable Android signing key
        env:
          MAZDA_KEYSTORE_B64: ${{ secrets.MAZDA_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.MAZDA_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MAZDA_SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.MAZDA_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$MAZDA_KEYSTORE_B64" ] || [ -z "$STORE_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Signing secrets are missing"
            exit 1
          fi
          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_ALIAS"
          echo "::add-mask::$KEY_PASS"
          printf '%s' "$MAZDA_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/mazda-update-key.jks"
          # Validate store password before compiling; no secrets in command output.
          if ! keytool -list -keystore "$RUNNER_TEMP/mazda-update-key.jks" -storepass "$STORE_PASS" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Signing keystore cannot be opened. Check STORE_PASSWORD, KEY_ALIAS and uploaded JKS base64."
            exit 1
          fi
          {
            echo "MAZDA_SIGNING_STORE_FILE=$RUNNER_TEMP/mazda-update-key.jks"
            echo "MAZDA_SIGNING_STORE_PASSWORD=$STORE_PASS"
            echo "MAZDA_SIGNING_KEY_ALIAS=$KEY_ALIAS"
            echo "MAZDA_SIGNING_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"
          echo "Signing keystore validated"
      - name: Build both Android Release APKs
        run: gradle :app:assembleRelease :catalog-admin:assembleRelease -PbuildNumber=$((1000 + ${{ github.run_number }})) --stacktrace
      - name: Align and sign Release APKs using existing update certificate
        shell: bash
        run: |
          set -euo pipefail
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -name zipalign -type f | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$ZIPALIGN" && test -n "$APKSIGNER"
          for module in app catalog-admin; do
            input="$module/build/outputs/apk/release/$module-release-unsigned.apk"
            test -s "$input"
            aligned="$RUNNER_TEMP/$module-release-aligned.apk"
            output="$module/build/outputs/apk/release/$module-release.apk"
            "$ZIPALIGN" -f -p 4 "$input" "$aligned"
            "$APKSIGNER" sign --ks "$MAZDA_SIGNING_STORE_FILE" --ks-key-alias "$MAZDA_SIGNING_KEY_ALIAS" --ks-pass env:MAZDA_SIGNING_STORE_PASSWORD --key-pass env:MAZDA_SIGNING_KEY_PASSWORD --out "$output" "$aligned"
            "$APKSIGNER" verify --verbose --print-certs "$output"
          done
      - name: Verify APK outputs
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          test -s catalog-admin/build/outputs/apk/release/catalog-admin-release.apk
          ls -lh app/build/outputs/apk/release/app-release.apk catalog-admin/build/outputs/apk/release/catalog-admin-release.apk
      - name: Verify both APKs use the same persistent certificate
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$APKSIGNER"
          STUDIO=app/build/outputs/apk/release/app-release.apk
          ADMIN=catalog-admin/build/outputs/apk/release/catalog-admin-release.apk
          "$APKSIGNER" verify --verbose --print-certs "$STUDIO" > /tmp/studio-cert.txt
          "$APKSIGNER" verify --verbose --print-certs "$ADMIN" > /tmp/admin-cert.txt
          studio_sha="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/studio-cert.txt | head -1)"
          admin_sha="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/admin-cert.txt | head -1)"
          test -n "$studio_sha" && test "$studio_sha" = "$admin_sha"
          echo "Both APKs signed with certificate SHA-256: $studio_sha"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          if-no-files-found: warn
          name: Mazda6GH-Studio-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          if-no-files-found: warn
          name: Mazda6GH-Admin-Release-APK
          path: catalog-admin/build/outputs/apk/release/catalog-admin-release.apk
