name: Build Windows Config EXE
on:
  workflow_dispatch:
  push:
    branches: [windows-config-v1]
    paths:
      - '.github/workflows/windows-config-build.yml'
      - 'windows-config/**'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, x86]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.architecture }}
      - name: Install dependencies
        run: python -m pip install -r windows-config/requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s windows-config -p "test_*.py" -v
      - name: Embed public Supabase connection
        shell: pwsh
        env:
          SUPABASE_PUBLIC_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          $key = $env:SUPABASE_PUBLIC_KEY
          if (-not $key.StartsWith('sb_publishable_')) {
            Write-Host "::warning::SUPABASE_PUBLISHABLE_KEY repository variable not configured; online sync disabled."
          }
          $json = ConvertTo-Json -InputObject $key -Compress
          Set-Content -Path windows-config/public_connection.py -Value ("PUBLISHABLE_KEY = " + $json) -Encoding utf8
      - name: Package executable
        working-directory: windows-config
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name M6GH-AS-Built-Config main.py
      - uses: actions/upload-artifact@v4
        with:
          name: M6GH-AS-Built-Config-Windows-${{ matrix.architecture }}
          path: windows-config/dist/M6GH-AS-Built-Config.exe
          if-no-files-found: error
